      <h1>Rogue Cell<span>一个关于免疫逃逸的小型肉鸽游戏</span></h1>
      <p class="game-splash-lead">你是肿瘤微环境中的一个癌细胞，将经历一场十五分钟、分为三幕的病程——肺、肝、脑。躲避、吸收营养、发生突变——当你准备好时，还可以同时在三条战线上反击：分裂出诱饵、策反免疫细胞互相攻击，甚至利用真实肿瘤逃避监视时所用的免疫检查点机制。宿主不会永远撑下去，但你也不必以一成不变的样子面对它。</p>
