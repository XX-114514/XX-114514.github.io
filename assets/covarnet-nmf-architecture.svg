<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">Shared modules across two views</title><desc id="d">Single-cell sample compositions and spatial state profiles share W. Each view has its own H. Graph penalties act on H, and new regions are evaluated with W fixed.</desc><rect width="1000" height="350" rx="18" fill="#10271d"/><g fill="none" stroke="#638d6a" stroke-width="2"><rect x="34" y="40" width="245" height="98" rx="12"/><rect x="34" y="207" width="245" height="98" rx="12"/><rect x="377" y="93" width="233" height="160" rx="12"/><rect x="711" y="40" width="255" height="98" rx="12"/><rect x="711" y="207" width="255" height="98" rx="12"/><path d="M279 89H329V143H377M279 255H329V203H377M610 143H662V89H711M610 203H662V255H711"/></g><g fill="#edf1dc" font-family="Arial,sans-serif" text-anchor="middle"><text x="156" y="78" font-size="18">SAMPLE COMPOSITION</text><text x="156" y="109" font-size="16" fill="#a9c4ad">X_sc ~ W H_sc</text><text x="156" y="245" font-size="18">SPATIAL STATE PROFILES</text><text x="156" y="277" font-size="16" fill="#a9c4ad">X_st ~ W H_st</text><text x="493" y="139" font-size="14" fill="#b7d29a">SHARED BASIS</text><text x="493" y="190" font-size="45" font-family="Georgia,serif">W</text><text x="493" y="225" font-size="16" fill="#a9c4ad">sparse state combinations</text><text x="838" y="78" font-size="18">GRAPH PENALTIES</text><text x="838" y="109" font-size="16" fill="#a9c4ad">neighbors constrain H</text><text x="838" y="245" font-size="18">HELD-OUT REGION</text><text x="838" y="277" font-size="16" fill="#a9c4ad">freeze W; estimate new H</text></g><text x="500" y="333" fill="#8faa96" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">Architecture schematic. No patient observations or learned weights are shown.</text></svg>